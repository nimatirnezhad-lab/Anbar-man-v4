<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><link rel="manifest" href="manifest.webmanifest"><title>انبار من</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#182338;font-family:-apple-system,BlinkMacSystemFont,Tahoma,Arial;padding-bottom:85px}.top{padding:20px;display:flex;align-items:center;gap:12px}.logo{background:linear-gradient(140deg,#10284b,#2680df);color:#baf6ff;border-radius:16px;padding:12px;font-size:25px}.top h1{font-size:20px;margin:0}.top small,.muted{color:#78849a}.wrap{max-width:760px;margin:auto;padding:8px 15px}.welcome,.card,.tile{background:white;border:1px solid #e7ecf4;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px #20365b0b}.welcome{background:linear-gradient(120deg,#eaf2ff,#fff)}h2{font-size:18px}.stats,.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{display:flex;gap:10px;align-items:center}.stat span{font-size:24px;background:#edf3ff;padding:9px;border-radius:13px}.stat b{display:block;font-size:19px}button{border:0;border-radius:13px;padding:12px 14px;background:#3768dc;color:white;font-weight:bold;font-size:14px}.tile{color:#1b2a42;text-align:center}.tile span{display:block;font-size:26px;margin-bottom:7px}.tile b{font-size:13px}.view{display:none}.view.active{display:block}.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:#637089;margin-bottom:5px}input,select{width:100%;padding:12px;border:1px solid #dce4ef;border-radius:12px;background:white;font:inherit;min-height:44px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;background:#edf1f7;color:#536078}.tabs .active{background:#3768dc;color:white}.buy{background:#fff0f0}.sell{background:#e9f8ef}.line{display:grid;grid-template-columns:1.3fr .6fr 1fr auto;gap:5px;margin:8px 0}.line input,.line select{padding:8px;min-width:0;font-size:12px}.line button{background:#fff0f0;color:#b44;padding:7px}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f5;gap:8px}.small{font-size:12px;color:#7a879b}.total{display:flex;justify-content:space-between;padding:9px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(15px);display:flex;justify-content:space-around;padding:9px 2px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #e5eaf2}.bottom button{background:none;color:#65738b;padding:5px;font-size:11px}.bottom span{display:block;font-size:20px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:5;align-items:end}.modal.open{display:flex}.sheet{background:#f4f7fc;border-radius:22px 22px 0 0;padding:20px;width:100%;max-height:90vh;overflow:auto}.sheet button{margin-top:8px}.muted{font-size:12px}.danger{background:#fff0f0;color:#b33}.table{overflow:auto}table{width:100%;font-size:12px;border-collapse:collapse}td,th{text-align:right;padding:9px;border-bottom:1px solid #e5eaf2}@media(min-width:600px){.stats,.tiles{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;justify-content:center}.sheet{max-width:600px;border-radius:22px}}@media print{.top,.bottom,button{display:none!important}.view{display:none!important}#print{display:block!important}}
</style></head><body>
<header class="top"><div class="logo">❄︎</div><div><h1>انبار من</h1><small>مدیریت خرید، فروش و موجودی</small></div></header>
<main class="wrap">
<section id="home" class="view active"><div class="welcome"><h2>سلام، خوش آمدی 👋</h2><span class="muted">مدیریت ساده و سریع انبار</span></div><div class="stats"><div class="card stat"><span>📦</span><div>کالاها<b id="sp">۰</b></div></div><div class="card stat"><span>👥</span><div>اشخاص<b id="speople">۰</b></div></div><div class="card stat"><span>🧾</span><div>فاکتورها<b id="si">۰</b></div></div><div class="card stat"><span>🚚</span><div>تحویل‌نشده<b id="sd">۰</b></div></div></div><div class="bar"><h2>دسترسی سریع</h2></div><div class="tiles"><button class="tile" onclick="go('invoice')"><span>🧾</span><b>ثبت فاکتور</b></button><button class="tile" onclick="go('delivery')"><span>🚚</span><b>تحویل کالا</b></button><button class="tile" onclick="go('products')"><span>📦</span><b>کالاها</b></button><button class="tile" onclick="go('people')"><span>👥</span><b>اشخاص</b></button><button class="tile" onclick="go('docs')"><span>📚</span><b>فاکتورها</b></button><button class="tile" onclick="go('reports')"><span>📊</span><b>گزارش‌ها</b></button><button class="tile" onclick="go('payments')"><span>💳</span><b>دریافت و پرداخت</b></button></div><div id="birth"></div></section>
<section id="invoice" class="view"><div class="bar"><h2>ثبت فاکتور</h2></div><div class="tabs"><button id="tb" class="active buy" onclick="kind='buy';invoiceUI()">خرید</button><button id="ts" class="sell" onclick="kind='sell';invoiceUI()">فروش</button></div><div class="card" id="form"></div></section>
<section id="products" class="view"><div class="bar"><h2>کالاها</h2><button onclick="productModal()">＋ افزودن</button></div><div class="card" id="plist"></div></section>
<section id="people" class="view"><div class="bar"><h2>اشخاص</h2><button onclick="personModal()">＋ افزودن</button></div><input id="ps" placeholder="جست‌وجوی نام" oninput="peopleUI()"><div class="card" id="peoplelist"></div></section>
<section id="docs" class="view"><div class="bar"><h2>فاکتورها</h2></div><div class="tabs"><button onclick="docKind='buy';docsUI()">خرید</button><button onclick="docKind='sell';docsUI()">فروش</button></div><div class="card" id="docslist"></div></section>
<section id="delivery" class="view"><h2>تحویل کالا</h2><div class="card" id="deliveries"></div></section>
<section id="reports" class="view"><h2>گزارش کالا و اشخاص</h2><input id="rq" placeholder="نام یا کد را جست‌وجو کن" oninput="reportUI()"><div class="card" id="reportlist"></div></section>
<section id="payments" class="view"><div class="bar"><h2>دریافت و پرداخت</h2><button onclick="paymentModal()">＋ ثبت</button></div><div class="card" id="paylist"></div></section><section id="print" style="display:none"></section>
</main><nav class="bottom"><button onclick="go('home')"><span>⌂</span>خانه</button><button onclick="go('invoice')"><span>🧾</span>فاکتور</button><button onclick="go('products')"><span>📦</span>کالا</button><button onclick="go('people')"><span>👥</span>اشخاص</button><button onclick="go('reports')"><span>▥</span>گزارش</button></nav>
<div class="modal" id="modal"><div class="sheet"><button class="danger" onclick="closeM()">بستن</button><div id="mb"></div></div></div>
<script>
const $=x=>document.getElementById(x),fmt=n=>(+n||0).toLocaleString('en-US'),val=x=>Number(String(x||'').replace(/,/g,''))||0;
let d=JSON.parse(localStorage.getItem('anbar5')||'null')||{products:[],people:[],invoices:[],payments:[],nextP:1001,nextI:1,ci:1,co:1};let kind='buy',docKind='buy',draft=[];
function save(){localStorage.setItem('anbar5',JSON.stringify(d));refresh()}function jalali(){return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function go(id){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');refresh()}
function openM(s){$('mb').innerHTML=s;$('modal').classList.add('open')}function closeM(){$('modal').classList.remove('open')}
function numInput(id){let e=$(id);let v=e.value.replace(/\D/g,'');e.value=v?Number(v).toLocaleString('en-US'):''}
function productModal(){openM(`<h3>افزودن کالا</h3><div class="field"><label>نام کالا</label><input id="pn"></div><div class="field"><label>قیمت خرید</label><input id="pc" value="0" inputmode="numeric" onfocus="this.select()" oninput="numInput('pc')"></div><div class="field"><label>قیمت فروش</label><input id="pp" value="0" inputmode="numeric" onfocus="this.select()" oninput="numInput('pp')"></div><button onclick="addP()">ذخیره</button>`)}
function addP(){if(!$('pn').value.trim())return alert('نام کالا لازم است');d.products.push({id:d.nextP++,name:$('pn').value.trim(),cost:val($('pc').value),price:val($('pp').value)});save();closeM()}
function personModal(){openM(`<h3>افزودن شخص</h3><div class="field"><label>نام و نام خانوادگی</label><input id="name"></div><div class="field"><label>نوع</label><select id="ptype"><option>مشتری</option><option>تأمین‌کننده</option><option>هر دو</option></select></div><div class="field"><label>تاریخ تولد شمسی</label><input id="birthdate" placeholder="مثلاً ۱۳۷۰/۰۵/۱۲"></div><button onclick="addPerson()">ذخیره</button>`)}
function addPerson(){if(!$('name').value.trim())return alert('نام را وارد کن');d.people.push({id:Date.now(),name:$('name').value.trim(),type:$('ptype').value,birth:$('birthdate').value});save();closeM()}
function invoiceUI(){$('tb').classList.toggle('active',kind==='buy');$('ts').classList.toggle('active',kind==='sell');$('form').className='card '+(kind==='buy'?'buy':'sell');$('form').innerHTML=`<div class="row"><div class="field"><label>شماره</label><input value="${d.nextI}" disabled></div><div class="field"><label>تاریخ شمسی</label><input id="date" value="${jalali()}"></div></div><div class="field"><label>${kind==='buy'?'تأمین‌کننده':'مشتری'}</label><select id="who"><option value="">انتخاب شخص</option>${d.people.filter(p=>p.type==='هر دو'||(kind==='buy'?p.type==='تأمین‌کننده':p.type==='مشتری')).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><button class="secondary" onclick="quickPerson()">＋ شخص جدید</button></div><div class="bar"><b>اقلام فاکتور</b><button class="secondary" onclick="addLine()">＋ ردیف کالا</button></div><div id="lines"></div>${kind==='buy'?'<label>هزینه حمل</label><input id="freight" value="0" onfocus="this.select()" oninput="numInput(\'freight\');calc()" inputmode="numeric">':'<label>تخفیف ثابت</label><input id="discount" value="0" onfocus="this.select()" oninput="numInput(\'discount\');calc()" inputmode="numeric">'}<div class="total">جمع کالاها <b id="subtotal">۰</b></div><div class="total">مبلغ نهایی <b id="grand">۰</b></div><button style="width:100%" onclick="settle()">ثبت فاکتور</button>`;addLine()}
function addLine(){let e=document.createElement('div');e.className='line';e.innerHTML=`<select class="prod" onchange="calc()"><option value="">کالا</option>${d.products.map(p=>`<option value="${p.id}">${p.id} - ${p.name}</option>`).join('')}</select><input class="qty" type="number" min="1" value="1" oninput="calc()"><input class="price" value="0" inputmode="numeric" onfocus="this.select()" oninput="numInputLine(this);calc()"><button onclick="this.parentElement.remove();calc()">×</button>`;$('lines').append(e)}
function numInputLine(e){let n=e.value.replace(/\D/g,'');e.value=n?Number(n).toLocaleString('en-US'):''}
function calc(){let s=[...document.querySelectorAll('.line')].reduce((a,r)=>a+val(r.querySelector('.qty').value)*val(r.querySelector('.price').value),0);$('subtotal').textContent=fmt(s);$('grand').textContent=fmt(Math.max(0,s+(kind==='buy'?val($('freight').value):-val($('discount').value))))}
function quickPerson(){let typ=kind==='buy'?'تأمین‌کننده':'مشتری';personModal();let old=window.addPerson;window.addPerson=function(){if(!$('name').value.trim())return alert('نام لازم است');let p={id:Date.now(),name:$('name').value.trim(),type:typ,birth:$('birthdate').value};d.people.push(p);save();closeM();invoiceUI();$('who').value=p.id;window.addPerson=old}}
function settle(){if(!$('who').value)return alert('شخص را انتخاب کن');let items=[...document.querySelectorAll('.line')].map(r=>({pid:+r.querySelector('.prod').value,qty:val(r.querySelector('.qty').value),price:val(r.querySelector('.price').value)})).filter(x=>x.pid&&x.qty);if(!items.length)return alert('کالا را انتخاب کن');let sum=items.reduce((a,x)=>a+x.qty*x.price,0),total=Math.max(0,sum+(kind==='buy'?val($('freight').value):-val($('discount').value)));openM(`<h3>تسویه فاکتور</h3><p>مبلغ کل: <b>${fmt(total)}</b></p><label>نقدی</label><input id="cash" value="${total}" inputmode="numeric" onfocus="this.select()" oninput="numInput('cash');remain(${total})"><label>کارت‌خوان</label><input id="pos" value="0" inputmode="numeric" oninput="numInput('pos');remain(${total})"><label>کارت‌به‌کارت</label><input id="transfer" value="0" inputmode="numeric" oninput="numInput('transfer');remain(${total})"><p>مانده: <b id="rem">${fmt(0)}</b></p><button onclick='commit(${JSON.stringify({items,total})})'>تأیید نهایی و نمایش فاکتور</button>`)}
function remain(t){$('rem').textContent=fmt(Math.max(0,t-val($('cash').value)-val($('pos').value)-val($('transfer').value)))}
function commit(x){let paid=val($('cash').value)+val($('pos').value)+val($('transfer').value);if(paid>x.total)return alert('پرداخت بیشتر از مبلغ فاکتور است');let i={id:d.nextI++,kind,date:$('date').value,person:+$('who').value,items:x.items,total:x.total,paid,freight:kind==='buy'?val($('freight').value):0,discount:kind==='sell'?val($('discount').value):0,delivered:{},methods:[['نقدی',$('cash').value],['کارت‌خوان',$('pos').value],['کارت‌به‌کارت',$('transfer').value]].filter(a=>val(a[1])).map(a=>({method:a[0],amount:val(a[1])}))};d.invoices.push(i);save();closeM();printInvoice(i);invoiceUI()}
function printInvoice(i){let p=d.people.find(x=>x.id===i.person),rows=i.items.map(x=>{let pr=d.products.find(y=>y.id===x.pid);return `<tr><td>${pr?.name||''}</td><td>${x.qty}</td><td>${fmt(x.price)}</td><td>${fmt(x.qty*x.price)}</td></tr>`}).join('');$('print').innerHTML=`<h2>انبار من | فاکتور ${i.kind==='buy'?'خرید':'فروش'}</h2><p>شماره ${i.id} | ${i.date} | ${p?.name||''}</p><table><tr><th>کالا</th><th>تعداد</th><th>قیمت</th><th>جمع</th></tr>${rows}</table><h3>مبلغ کل: ${fmt(i.total)}</h3><p>پرداخت: ${fmt(i.paid)} | مانده: ${fmt(i.total-i.paid)}</p><button onclick="window.print()">چاپ / PDF</button>`;$('print').style.display='block';window.print();$('print').style.display='none'}
function peopleUI(){let q=$('ps').value;$('peoplelist').innerHTML=d.people.filter(p=>p.name.includes(q)).map(p=>`<div class="item">${p.name}<span class="small">${p.type} ${p.birth||''}</span></div>`).join('')||'هنوز شخصی ثبت نشده.'}
function docsUI(){$('docslist').innerHTML=d.invoices.filter(i=>i.kind===docKind).slice().reverse().map(i=>`<div class="item"><div>فاکتور ${i.id}<div class="small">${i.date} | ${fmt(i.total)} | مانده ${fmt(i.total-i.paid)}</div></div><button onclick="printInvoice(d.invoices.find(x=>x.id===${i.id}))">چاپ</button></div>`).join('')||'فاکتوری ثبت نشده.'}
function deliveryUI(){$('deliveries').innerHTML=d.invoices.filter(i=>i.kind==='sell').flatMap(i=>i.items.map((x,n)=>`<div class="item"><div>${d.products.find(p=>p.id===x.pid)?.name||'کالا'} × ${x.qty}<div class="small">فاکتور ${i.id} | ${d.people.find(p=>p.id===i.person)?.name||''} | ${i.delivered[n]||'تحویل نشده'}</div></div><button onclick="mark(${i.id},${n})">تحویل شد</button></div>`)).join('')||'موردی برای تحویل نیست.'}
function mark(id,n){let i=d.invoices.find(x=>x.id===id);i.delivered[n]=jalali();save()}
function reportUI(){let q=$('rq').value;$('reportlist').innerHTML=[...d.products.filter(p=>p.name.includes(q)||String(p.id).includes(q)).map(p=>`<div class="item">${p.id} - ${p.name}<span>سوابق ${d.invoices.filter(i=>i.items.some(x=>x.pid===p.id)).length}</span></div>`),...d.people.filter(p=>p.name.includes(q)).map(p=>`<div class="item">${p.name}<span>فاکتور ${d.invoices.filter(i=>i.person===p.id).length}</span></div>`)].join('')||'نتیجه‌ای یافت نشد.'}
function paymentModal(){openM(`<h3>ثبت دریافت / پرداخت</h3><label>شخص</label><select id="payperson">${d.people.map(p=>`<option value="${p.id}">${p.name}</option>`)}</select><label>نوع</label><select id="paytype"><option>دریافت</option><option>پرداخت</option></select><label>روش</label><select id="method" onchange="document.querySelectorAll('.chq').forEach(x=>x.style.display=this.value==='چک'?'block':'none')"><option>نقدی</option><option>کارت‌خوان</option><option>کارت‌به‌کارت</option><option>چک</option></select><label>مبلغ</label><input id="amount" inputmode="numeric"><div class="chq" style="display:none"><label>بانک</label><input id="bank"><label>شماره صیادی ۱۶ رقمی</label><input id="sayad" maxlength="16" inputmode="numeric"><label>صاحب چک</label><input id="owner"></div><button onclick="savePay()">ذخیره</button>`)}
function savePay(){let m=$('method').value;if(m==='چک'&&!/^\d{16}$/.test($('sayad').value))return alert('شماره صیادی باید ۱۶ رقم باشد');d.payments.push({person:+$('payperson').value,type:$('paytype').value,method:m,amount:val($('amount').value),date:jalali(),bank:$('bank')?.value,sayad:$('sayad')?.value,owner:$('owner')?.value,number:m==='چک'?($('paytype').value==='دریافت'?d.ci++:d.co++):null});save();closeM()}
function refresh(){ $('plist').innerHTML=d.products.map(p=>`<div class="item">${p.id} - ${p.name}<span>${fmt(p.cost)} / ${fmt(p.price)}</span></div>`).join('')||'کالایی ثبت نشده.';peopleUI();docsUI();deliveryUI();reportUI();$('paylist').innerHTML=d.payments.map(p=>`<div class="item">${p.type} ${p.method}<b>${fmt(p.amount)}</b></div>`).join('')||'پرداختی ثبت نشده.';$('sp').textContent=d.products.length;$('speople').textContent=d.people.length;$('si').textContent=d.invoices.length;$('sd').textContent=d.invoices.filter(i=>i.kind==='sell').reduce((a,i)=>a+i.items.filter((x,n)=>!i.delivered[n]).length,0)}
function init(){refresh();invoiceUI();}init();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
